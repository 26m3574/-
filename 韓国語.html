<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

   <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ★ iPhoneでホーム画面追加できる設定（③ここ） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon.png">
  
  <title>英単語4択クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- スタート画面 -->
  <div id="settingsArea" class="card">
    <h2>英単語4択クイズ</h2>

    <label>出題モード</label>
    <select id="mode">
      <option value="en_to_jp">英 → 日本語</option>
      <option value="jp_to_en">日本語 → 英</option>
    </select>

    <label>問題数</label>
    <input type="number" id="questionCount" value="10" min="1" max="100">

    <label>時間制限（秒）</label>
    <input type="number" id="timeLimit" value="10" min="3" max="60">

    <button class="start-btn" onclick="startQuiz()">スタート</button>
  </div>

  <!-- 進行状況 -->
  <div id="progressArea" class="info" style="display:none;">
    <span id="timer">残り時間: 0秒</span>
    <span id="nowNum">0</span> / <span id="totalNum">0</span>
  </div>

  <!-- 問題画面 -->
  <div id="quizArea" class="card" style="display:none;">
    <h3 id="questionTitle">問題</h3>
    <div id="question" class="question-text"></div>
    <div id="choices"></div>

    <div id="judge"></div>

    <button id="nextBtn" class="next-btn" style="display:none;" onclick="goNext()">次へ</button>
  </div>

  <!-- 結果画面 -->
  <div id="resultArea" class="card" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
